<svg xmlns="http://www.w3.org/2000/svg" width="495" height="260" viewBox="0 0 495 260" role="img" aria-label="Most used languages">
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.t{font-size:18px;font-weight:600;fill:#F06EA9}
.n{font-size:13px;fill:#C9D1D9}
.p{font-size:12px;fill:#9BA4B5}
.b{transform-box:fill-box;transform-origin:left center;animation:g .9s ease-out both}
@keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<rect width="495" height="260" rx="6" fill="#0D1117"/>
<text class="t" x="25" y="35">Most Used Languages</text>
<text class="n" x="25" y="73">Dart</text>
<rect x="150" y="62" width="270" height="12" rx="6" fill="#21262D"/>
<rect class="b" x="150" y="62" width="72.7" height="12" rx="6" fill="#4F5BD5" style="animation-delay:0.0s"/>
<text class="p" x="432" y="73">26.9%</text>
<text class="n" x="25" y="103">HTML</text>
<rect x="150" y="92" width="270" height="12" rx="6" fill="#21262D"/>
<rect class="b" x="150" y="92" width="65.4" height="12" rx="6" fill="#F06EA9" style="animation-delay:0.1s"/>
<text class="p" x="432" y="103">24.2%</text>
<text class="n" x="25" y="133">JavaScript</text>
<rect x="150" y="122" width="270" height="12" rx="6" fill="#21262D"/>
<rect class="b" x="150" y="122" width="32.4" height="12" rx="6" fill="#7FDDEA" style="animation-delay:0.2s"/>
<text class="p" x="432" y="133">12.0%</text>
<text class="n" x="25" y="163">CSS</text>
<rect x="150" y="152" width="270" height="12" rx="6" fill="#21262D"/>
<rect class="b" x="150" y="152" width="32.2" height="12" rx="6" fill="#4F5BD5" style="animation-delay:0.3s"/>
<text class="p" x="432" y="163">11.9%</text>
<text class="n" x="25" y="193">C++</text>
<rect x="150" y="182" width="270" height="12" rx="6" fill="#21262D"/>
<rect class="b" x="150" y="182" width="30.2" height="12" rx="6" fill="#F06EA9" style="animation-delay:0.4s"/>
<text class="p" x="432" y="193">11.2%</text>
<text class="n" x="25" y="223">CMake</text>
<rect x="150" y="212" width="270" height="12" rx="6" fill="#21262D"/>

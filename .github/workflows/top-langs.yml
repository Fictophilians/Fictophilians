name: Update top languages card

on:
  schedule:
    - cron: "0 3 * * *"        # every day
  workflow_dispatch:            # manual run button
  push:
    paths:
      - ".github/scripts/top_langs.py"
      - ".github/workflows/top-langs.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Fictophilians
          MAX_LANGS: "6"
          # EXCLUDE_LANGS: "Shell,Jupyter Notebook"
        run: python .github/scripts/top_langs.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-langs.svg
          git diff --staged --quiet || git commit -m "chore: update top languages card"
          git push
